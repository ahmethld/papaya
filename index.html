 if(!L.length)return `<h2>Sepet</h2><p class="mu">Sepetiniz boş.</p>${tplBar()}<button class="p" onclick="go('shop')">Ürünlere git</button>`;
 const tot=L.reduce((a,x)=>a+x.p.price*x.q,0),tm=new Date(Date.now()+864e5).toISOString().slice(0,10);
 return `<h2>Sepet</h2>${tplBar()}<div class="tw"><table><tr><th>Ürün</th><th>Miktar</th><th>Tutar</th><th></th></tr>${L.map(x=>`<tr><td>${esc(x.p.name)}<div class="mu">${TL(x.p.price)} / ${esc(x.p.unit)}</div></td><td style="width:120px"><input type="number" min="${x.p.min}" step="any" value="${x.q}" onchange="setQ(${x.p.id},this.value)"> ${esc(x.p.unit)}</td><td>${TL(x.p.price*x.q)}</td><td><button class="d" onclick="rm(${x.p.id})">Sil</button></td></tr>`).join("")}</table></div><p><b>Toplam: ${TL(tot)}</b> <span class="mu">(KDV hariç)</span></p>
 <div class="two"><div><label>İstenen teslim tarihi</label><input type="date" id="dd" value="${tm}" min="${tm}"></div><div><label>Teslimat saati</label><select id="dt"><option>06:00 – 09:00</option><option>09:00 – 12:00</option><option>12:00 – 15:00</option></select></div></div><label>Sipariş notu</label><textarea id="nt" rows="2"></textarea><div class="note">Ödeme yalnızca IBAN’a havale/EFT ile alınır. Siparişi oluşturduktan sonra IBAN bilgisi ekranda gösterilir.</div><p><button class="p" onclick="order()">Siparişi oluştur</button></p>`}
function setQ(id,q){const p=D.products.find(x=>x.id===id),o=ui.cart[id]||0;q=parseFloat(q);q=q>=p.min?q:p.min;ui.cart[id]=q;if(q>o)track("cart_add",{pid:id,q:q-o,val:(q-o)*p.price});else if(q<o)track("cart_remove",{pid:id,q:o-q});render()}
function rm(id){track("cart_remove",{pid:id,q:ui.cart[id]||0});delete ui.cart[id];render()}
function order(){const u=me();if(!u){toast("Sipariş için önce giriş yapın");ui.auth="login";return go("acc")}
 const items=Object.keys(ui.cart).map(id=>{const p=D.products.find(x=>x.id==id);return p&&vis(p)&&{pid:p.id,name:p.name,unit:p.unit,price:p.price,qty:ui.cart[id]}}).filter(Boolean);
 if(!items.length)return toast("Sepetinizde sipariş verilebilir ürün yok");
 const tot=items.reduce((a,i)=>a+i.price*i.qty,0),at=new Date().toLocaleString("tr-TR"),id=D.seq++;
 D.orders.unshift({id,uid:u.id,items,total:tot,date:$("#dd").value,slot:$("#dt").value,note:$("#nt").value,status:"Ödeme bekleniyor",hist:[{s:"Ödeme bekleniyor",at}],ts:Date.now(),at});
 D.notes.unshift({id:D.seq++,uid:u.id,t:"Sipariş #"+id+" alındı",m:"Siparişiniz oluşturuldu. IBAN’a ödemeyi yapıp dekontu bize iletin; ödemeniz onaylanınca bilgilendirileceksiniz.",kind:"order",ts:Date.now(),at});
 track("order",{val:tot,q:items.reduce((a,i)=>a+i.qty,0)});save();ui.cart={};ui.t="order";ui.oid=id;go("thanks")}
function vAcc(){const u=me();
 if(!u){const r=ui.auth==="reg";return `<h2>${r?"İşletme kaydı":"Giriş yap"}</h2><div class="card" style="max-width:520px">${r?`<label>İşletme adı</label><input id="a1"><div class="two"><div><label>İşletme türü</label><select id="a2">${[...D.tpls.map(t=>t.name),"Diğer"].map(x=>`<option>${esc(x)}</option>`).join("")}</select></div><div><label>Yetkili kişi</label><input id="a3"></div></div><label>Telefon</label><input id="a4" type="tel"><label>Teslimat adresi</label><textarea id="a5" rows="2"></textarea>`:""}<label>E-posta</label><input id="a6" type="email"><label>Şifre</label><input id="a7" type="password"><p><button class="p" onclick="${r?"reg()":"login()"}">${r?"Kayıt ol":"Giriş yap"}</button> <button onclick="ui.auth='${r?"login":"reg"}';render()">${r?"Hesabım var":"Yeni kayıt"}</button></p></div>`}
 const O=D.orders.filter(o=>o.uid===u.id);
 return `<div class="row"><h2 class="sp">${esc(u.name)}</h2><button onclick="D.sess=null;save();render()">Çıkış</button></div><p class="mu">${esc(u.type)} · ${esc(u.contact)} · ${esc(u.phone)}<br>${esc(u.addr)}</p><h2>Siparişlerim</h2>${O.length?O.map(o=>`<div class="card" style="margin-bottom:10px"><div class="row"><b>#${o.id}</b><span class="badge">${o.status}</span><span class="sp"></span><span class="mu">${o.at}</span></div><div class="mu">${o.items.map(i=>`${esc(i.name)} ×${i.qty} ${esc(i.unit)}`).join(", ")}</div>${o.hist&&o.hist.length>1?`<div class="mu">Son durum değişikliği: ${esc(o.hist[o.hist.length-1].at)}</div>`:""}${o.status==="Ödeme bekleniyor"?ibanH(o.id):""}<div class="row" style="margin-top:6px"><b>${TL(o.total)}</b><span class="mu">Teslim: ${o.date} ${esc(o.slot)}</span><span class="sp"></span><button onclick="again(${o.id})">Tekrar sipariş ver</button></div></div>`).join(""):'<p class="mu">Henüz siparişiniz yok.</p>'}`}
const v=id=>$("#"+id).value.trim();
function reg(){clr();const e=v("a6").toLowerCase();let ok=1;if(!v("a1")){fe("a1","İşletme adını yazın.");ok=0}if(!okTel(v("a4"))){fe("a4","Geçerli bir telefon numarası yazın (alan koduyla).");ok=0}if(!okMail(e)){fe("a6","Geçerli bir e-posta adresi yazın.");ok=0}if(v("a7").length<6){fe("a7","Şifre en az 6 karakter olmalı.");ok=0}if(!ok){const b=$(".bad");b&&b.focus();return}if(D.users.some(u=>u.email===e)){fe("a6","Bu e-posta ile zaten kayıt var. Giriş yapmayı deneyin.");return}const u={id:D.seq++,name:v("a1"),type:v("a2"),contact:v("a3"),phone:v("a4"),addr:v("a5"),email:e,pw:v("a7"),seen:Date.now()};D.users.push(u);D.sess=u.id;track("register");save();toast("Kayıt tamamlandı");render()}
function login(){const u=D.users.find(x=>x.email===v("a6").toLowerCase()&&x.pw===v("a7"));if(!u){track("login_fail");clr();fe("a7","E-posta veya şifre hatalı.");return}D.sess=u.id;track("login");save();render();const n=unread();if(n)toast(n+" yeni bildiriminiz var")}
function again(id){D.orders.find(x=>x.id===id).items.forEach(i=>{if(D.products.find(p=>p.id===i.pid&&vis(p))){ui.cart[i.pid]=i.qty;track("cart_add",{pid:i.pid,q:i.qty,val:i.qty*i.price})}});toast("Ürünler sepete eklendi");go("cart")}

const TB=[["rep","Raporlar","a"],["prods","Ürünler","ay"],["orders","Siparişler","ay"],["cust","Müşteriler","a"],["msgs","Mesajlar","a"],["ann","Duyurular ve bildirimler","a"],["revs","Yorumlar","a"],["tpls","Şablonlar","a"],["site","Site içeriği","a"],["refs","Referanslar","a"],["contact","İletişim","a"],["pay","Ödeme (IBAN)","a"],["set","Ayarlar","a"]];
const can=t=>TB.some(x=>x[0]===t&&x[2].includes(ui.role==="admin"?"a":"y"));
async function sha(t){const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(t));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}
async function admIn(){let h;try{h=await sha($("#ap").value)}catch(e){return toast("Bu tarayıcıda güvenli giriş çalışmıyor (https gerekir)")}
 const r=h===D.pwh.admin?"admin":h===D.pwh.yetkili?"yetkili":"";if(!r)return toast("Şifre yanlış");ui.adm=true;ui.role=r;if(!can(ui.tab))ui.tab="prods";render()}
function vAdm(){
 if(!ui.adm)return `<h2>Yönetim girişi</h2><div class="card" style="max-width:380px"><label>Şifre</label><input id="ap" type="password" autocomplete="current-password" onkeydown="if(event.key==='Enter')admIn()"><p><button class="p" onclick="admIn()">Giriş</button> <button onclick="go('home')">Siteye dön</button></p></div>`;
 if(!can(ui.tab))ui.tab="prods";
 const nb={orders:D.orders.filter(o=>o.status==="Ödeme bekleniyor").length,msgs:D.msgs.length};
 return `<div class="row"><h2 class="sp">Yönetim paneli <span class="badge">${ui.role==="admin"?"Admin":"Yetkili"}</span></h2><button onclick="go('home')">Siteye dön</button><button onclick="ui.adm=false;ui.role='';go('home')">Çıkış</button></div><div class="chips">${TB.filter(t=>can(t[0])).map(t=>`<button class="${ui.tab===t[0]?"on":""}" onclick="ui.tab='${t[0]}';render()">${t[1]}${nb[t[0]]?" ("+nb[t[0]]+")":""}</button>`).join("")}</div>`+{rep:aRep,prods:aProds,orders:aOrders,cust:aCust,msgs:aMsgs,ann:aAnn,revs:aRevs,tpls:aTpls,site:aSite,refs:aRefs,contact:aContact,pay:aPay,set:aSet}[ui.tab]()}
function aProds(){return `<div class="row" style="margin-bottom:10px"><button class="p" onclick="pform()">+ Yeni ürün</button><input placeholder="Ürün ara…" style="max-width:240px" oninput="ui.aq=this.value;aGrid()" value="${esc(ui.aq||"")}"><label style="margin:0"><input type="checkbox" style="width:auto" ${S().showOos?"checked":""} onchange="S().showOos=this.checked;save();toast('Kaydedildi')"> Stokta olmayanı “Stokta yok” diye göster (kapalıysa sitede hiç görünmez)</label></div><p class="mu">Aktif/Pasif: pasif ürün sitede görünmez. Fiyatı kutudan doğrudan değiştirebilirsiniz.</p><div class="tw"><table><tr><th></th><th>Ürün</th><th>Kategori</th><th>Fiyat (₺)</th><th>Stok</th><th>Sitede</th><th>Yorum</th><th></th></tr><tbody id="ag"></tbody></table></div>`}
function aGrid(){const q=(ui.aq||"").toLocaleLowerCase("tr");const e=$("#ag");if(!e)return;e.innerHTML=D.products.filter(p=>!q||(p.name+" "+p.cat).toLocaleLowerCase("tr").includes(q)).map(p=>`<tr style="${p.on===false?"opacity:.55":""}"><td style="width:56px">${p.img?`<img src="${p.img}" style="width:44px;height:44px;object-fit:cover;border-radius:8px" alt="">`:`<span style="font-size:30px">${p.e||"📦"}</span>`}</td><td><b>${esc(p.name)}</b><div class="mu">/ ${esc(p.unit)}</div></td><td>${esc(p.cat)}</td><td><input type="number" step="0.01" value="${p.price}" style="width:92px" aria-label="Fiyat" onchange="setPrice(${p.id},this.value)"></td><td><button class="${p.stock?"on":"d"}" onclick="tgl(${p.id})">${p.stock?"Var":"Yok"}</button></td><td><button class="${p.on===false?"d":"on"}" onclick="act(${p.id})">${p.on===false?"Pasif":"Aktif"}</button></td><td><select style="width:auto" aria-label="Yorum ayarı" onchange="setRm(${p.id},this.value)"><option value="" ${!p.rm?"selected":""}>Genel ayar</option><option value="ro" ${p.rm==="ro"?"selected":""}>Yeni yorum kapalı</option><option value="off" ${p.rm==="off"?"selected":""}>Yorumlar gizli</option></select></td><td style="white-space:nowrap"><button onclick="pform(${p.id})">Düzenle</button> <button class="d" onclick="del(${p.id})">Sil</button></td></tr>`).join("")||'<tr><td colspan="8" class="mu">Ürün bulunamadı.</td></tr>'}
function tgl(id){const p=D.products.find(x=>x.id===id);p.stock=!p.stock;save();aGrid()}
function act(id){const p=D.products.find(x=>x.id===id);p.on=p.on===false;save();aGrid()}
function setRm(id,x){D.products.find(p=>p.id===id).rm=x;save();toast("Kaydedildi")}
function setPrice(id,x){const n=parseFloat(x);if(!(n>=0))return toast("Geçerli fiyat girin");D.products.find(p=>p.id===id).price=n;save();toast("Fiyat güncellendi")}
function del(id){if(confirm("Ürün silinsin mi? (Şablonlardan da çıkarılır)")){D.products=D.products.filter(p=>p.id!==id);D.tpls.forEach(t=>t.items=t.items.filter(i=>i.pid!==id));save();render()}}
function pform(id){const p=id?D.products.find(x=>x.id===id):{name:"",cat:"Sebze",price:"",unit:"kg",desc:"",detail:"",img:"",e:"📦",min:1};ui.img=p.img;
 modal(`<h2>${id?"Ürünü düzenle":"Yeni ürün"}</h2><label>Ürün adı</label><input id="f1" value="${esc(p.name)}"><div class="two"><div><label>Kategori</label><input id="f2" list="cl" value="${esc(p.cat)}"><datalist id="cl">${[...new Set(D.products.map(x=>x.cat))].map(c=>`<option>${esc(c)}`).join("")}</datalist></div><div><label>Birim</label><select id="f3">${UN.map(u=>`<option ${u===p.unit?"selected":""}>${u}</option>`).join("")}</select></div><div><label>Birim fiyat (₺)</label><input id="f4" type="number" step="0.01" value="${p.price}"></div><div><label>Min. sipariş</label><input id="f5" type="number" step="any" value="${p.min}"></div></div><label>Kısa açıklama</label><input id="f6" value="${esc(p.desc)}"><label>Detay (menşei, ambalaj vb.)</label><textarea id="f7" rows="3">${esc(p.detail)}</textarea><label>Görsel (yoksa emoji görünür)</label><input type="file" accept="image/*" onchange="upImg(this.files[0])"><div class="row" style="margin-top:6px"><span id="pv">${ui.img?"Görsel seçili ✔":""}</span><button onclick="ui.img='';$('#pv').textContent=''">Görseli kaldır</button></div><label>Emoji</label><input id="f8" value="${esc(p.e)}" maxlength="4"><p class="row"><button class="p" onclick="psave(${id||0})">Kaydet</button><button onclick="modal()">İptal</button></p>`)}
function upImg(f){if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const s=Math.min(1,600/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=im.width*s;c.height=im.height*s;c.getContext("2d").drawImage(im,0,0,c.width,c.height);ui.img=c.toDataURL("image/jpeg",.8);$("#pv").textContent="Görsel seçili ✔"};im.src=r.result};r.readAsDataURL(f)}
function psave(id){const n=v("f1"),pr=parseFloat(v("f4"));if(!n||!(pr>=0))return toast("Ad ve fiyat gerekli");const o={name:n,cat:v("f2")||"Diğer",unit:v("f3"),price:pr,min:parseFloat(v("f5"))||1,desc:v("f6"),detail:v("f7"),img:ui.img,e:v("f8")||"📦"};
 if(id)Object.assign(D.products.find(p=>p.id===id),o);else D.products.push({id:D.seq++,stock:true,on:true,rm:"",...o});save();modal();render();toast("Kaydedildi")}
const SM={"Onaylandı":"Ödemeniz onaylandı, siparişiniz kabul edildi.","Hazırlanıyor":"Siparişiniz hazırlanıyor.","Yolda":"Siparişiniz yola çıktı.","Teslim edildi":"Siparişiniz teslim edildi. Afiyet olsun!","İptal":"Siparişiniz iptal edildi. Sorularınız için bizi arayabilirsiniz.","Ödeme bekleniyor":"Siparişiniz ödeme bekliyor. Dekontu bize iletmeyi unutmayın."};
function aOrders(){const f=ui.of||"",L=D.orders.filter(o=>!f||o.status===f);
 return `<div class="row" style="margin-bottom:10px"><select style="width:auto" aria-label="Duruma göre filtrele" onchange="ui.of=this.value;render()"><option value="">Tüm durumlar (${D.orders.length})</option>${ST.map(x=>`<option value="${x}" ${x===f?"selected":""}>${x} (${D.orders.filter(o=>o.status===x).length})</option>`).join("")}</select><span class="mu">Durum değişince müşteriye otomatik bildirim gider.</span></div>`+(L.length?L.map(o=>{const u=D.users.find(x=>x.id===o.uid)||{};return `<div class="card" style="margin-bottom:10px"><div class="row"><b>#${o.id} · ${esc(u.name||"—")}</b><span class="badge">${esc(o.status)}</span><span class="sp"></span><select style="width:auto" aria-label="Durum" onchange="setSt(${o.id},this.value)">${ST.map(x=>`<option ${x===o.status?"selected":""}>${x}</option>`).join("")}</select></div><div class="mu">${esc(u.phone||"")} · ${esc(u.addr||"")}<br>Teslim: ${esc(o.date)} ${esc(o.slot)} · Verildi: ${esc(o.at)}</div><div>${o.items.map(i=>`${esc(i.name)} ×${i.qty} ${esc(i.unit)}`).join(", ")}</div>${o.note?`<div class="mu">Not: ${esc(o.note)}</div>`:""}<div class="row" style="margin-top:6px"><b>${TL(o.total)}</b><span class="sp"></span>${o.status==="Ödeme bekleniyor"?`<button class="p" onclick="setSt(${o.id},'Onaylandı')">✔ Ödemeyi onayla</button><button class="d" onclick="setSt(${o.id},'İptal')">İptal et</button>`:""}</div></div>`}).join(""):'<p class="mu">Bu durumda sipariş yok.</p>')}
function setSt(id,s){const o=D.orders.find(x=>x.id===id);if(!o||o.status===s)return;const at=new Date().toLocaleString("tr-TR");o.status=s;(o.hist=o.hist||[]).push({s,at});if(o.uid)D.notes.unshift({id:D.seq++,uid:o.uid,t:"Sipariş #"+id+": "+s,m:SM[s]||("Sipariş durumu: "+s),kind:"order",ts:Date.now(),at});save();render();toast(o.uid?"Durum güncellendi, müşteriye bildirim gönderildi":"Durum güncellendi")}
function aCust(){return D.users.length?`<div class="tw"><table><tr><th>İşletme</th><th>Tür</th><th>İletişim</th><th>Sipariş</th><th>Toplam</th></tr>${D.users.map(u=>{const O=D.orders.filter(o=>o.uid===u.id);return `<tr><td><b>${esc(u.name)}</b><div class="mu">${esc(u.addr)}</div></td><td>${esc(u.type)}</td><td>${esc(u.contact)}<div class="mu">${esc(u.phone)} · ${esc(u.email)}</div></td><td>${O.length}</td><td>${TL(O.reduce((a,o)=>a+o.total,0))}</td></tr>`}).join("")}</table></div>`:'<p class="mu">Henüz kayıtlı müşteri yok.</p>'}
function aMsgs(){return D.msgs.length?D.msgs.map(m=>`<div class="card" style="margin-bottom:10px"><div class="row"><b>${esc(m.n)}</b><span class="mu">${esc(m.c)}</span><span class="sp"></span><span class="mu">${m.at}</span><button class="d" onclick="D.msgs=D.msgs.filter(x=>x.id!==${m.id});save();render()">Sil</button></div><div>${esc(m.m)}</div></div>`).join(""):'<p class="mu">Henüz mesaj yok.</p>'}
const SF=[["name","Firma adı"],["tag","Alt başlık / slogan"],["logo","Logo (emoji)"],["heroT","Ana sayfa başlığı"],["heroS","Ana sayfa alt metni","t"],["aboutT","Hakkımızda başlığı"],["aboutP","Hakkımızda metni (paragraflar arası boş satır)","t"],["ctaT","Üst bar metni"],["domain","Site adresi (https://www.ornek.com)"],["gsc","Google Search Console doğrulama kodu"],["ga","Google Analytics ölçüm kimliği (G-XXXXXXXXXX)"],["privacy","Gizlilik politikası metni","t"],["terms","Kullanım koşulları metni","t"]];
const CF=[["phone","Telefon"],["wa","WhatsApp numarası (905xxxxxxxxx)"],["email","E-posta"],["hours","Çalışma saatleri"],["ig","Instagram kullanıcı adı"],["mapq","Harita arama ifadesi (adres veya firma adı)"],["addr","Adres","t"],["contactNote","İletişim sayfasında görünecek kısa açıklama (isteğe bağlı)","t"]];
const PF=[["bank","Banka adı"],["holder","Hesap sahibi (unvan)"],["iban","IBAN"],["dMail","Dekont e-posta adresi (boşsa iletişim e-postası)"],["dTel","Dekont telefon numarası (boşsa iletişim telefonu)"],["payNote","Ek ödeme notu (isteğe bağlı)","t"]];
const fld=(L,s)=>L.map(f=>`<div style="${f[2]?"grid-column:1/-1":""}"><label>${f[1]}</label>${f[2]?`<textarea id="s_${f[0]}" rows="3">${esc(s[f[0]])}</textarea>`:`<input id="s_${f[0]}" value="${esc(s[f[0]])}">`}</div>`).join("");
const val=id=>{const e=$("#"+id);return e?e.value.trim():null};
function collect(){const s=S();[SF,CF,PF].forEach(L=>L.forEach(f=>{const x=val("s_"+f[0]);if(x!==null)s[f[0]]=x}));
 s.sv=s.sv.map((x,i)=>({e:val(`sv${i}e`)??x.e,t:val(`sv${i}t`)??x.t,d:val(`sv${i}d`)??x.d}));s.vl=s.vl.map((x,i)=>({t:val(`vl${i}t`)??x.t,d:val(`vl${i}d`)??x.d}));
 s.faq=s.faq.map((x,i)=>({q:val(`fq${i}q`)??x.q,a:val(`fq${i}a`)??x.a}));s.cases=s.cases.map((x,i)=>({t:val(`cs${i}t`)??x.t,s:val(`cs${i}s`)??x.s,r:val(`cs${i}r`)??x.r}));
 s.rv=s.rv.map((x,i)=>({n:val(`rv${i}n`)??x.n,t:val(`rv${i}t`)??x.t,x:val(`rv${i}x`)??x.x}));s.refs=s.refs.map((x,i)=>({n:val(`rf${i}n`)??x.n,t:val(`rf${i}t`)??x.t,d:val(`rf${i}d`)??x.d,img:x.img}))}
const NEW={faq:()=>({q:"",a:""}),cases:()=>({t:"",s:"",r:""}),rv:()=>({n:"",t:"",x:""}),refs:()=>({n:"",t:"",d:"",img:""})};

function cp(t){try{navigator.clipboard.writeText(t).then(()=>toast("Kopyalandı"))}catch(e){toast("Kopyalanamadı")}}
function ibanH(oid){const s=S(),o=D.orders.find(x=>x.id===oid),ib=(s.iban||"").trim(),m=s.dMail||s.email,t=s.dTel||s.phone;
 return `<div class="card" style="margin:12px 0"><h3>Ödeme bilgileri (yalnızca IBAN / havale-EFT)</h3>${ib?`<div class="mu">Banka</div><b>${esc(s.bank)}</b><div class="mu" style="margin-top:6px">Hesap sahibi</div><b>${esc(s.holder)}</b><div class="mu" style="margin-top:6px">IBAN</div><div class="row"><b style="font-size:17px">${esc(ib)}</b><button onclick="cp('${esc(ib.replace(/\s/g,""))}')">Kopyala</button></div>`:'<p>IBAN bilgisi henüz tanımlanmadı. Lütfen bizi arayın.</p>'}${o?`<div class="mu" style="margin-top:6px">Havale açıklaması</div><b>Sipariş #${o.id}</b>`:""}<p class="mu" style="margin-top:10px">Ödemeyi bu IBAN’a gönderdikten sonra <b>${esc(m)}</b> e-posta adresine veya <b>${esc(t)}</b> telefon numarasına dekont ile birlikte bilgi verin.${s.payNote?" "+esc(s.payNote):""}</p></div>`}
/* şablonlar (müşteri) */
function tplBar(){if(!D.tpls.length)return"";const u=me(),L=[...D.tpls].sort((a,b)=>(b.name===(u&&u.type))-(a.name===(u&&u.type)));return `<div class="note"><b>Hazır sipariş şablonları</b> – işletme türünüze uygun ürünleri tek tıkla sepete ekleyin, sonra miktarları düzenleyin.<div class="row" style="margin-top:8px">${L.map(t=>`<button class="${u&&u.type===t.name?"p":""}" onclick="useTpl(${t.id})">${esc(t.name)} şablonu</button>`).join("")}</div></div>`}
function useTpl(id){const t=D.tpls.find(x=>x.id===id);let n=0;t.items.forEach(i=>{const p=D.products.find(x=>x.id===i.pid);if(p&&vis(p)){ui.cart[p.id]=(ui.cart[p.id]||0)+i.q;n++;track("cart_add",{pid:p.id,q:i.q,val:p.price*i.q})}});toast(n?t.name+" şablonundan "+n+" ürün sepete eklendi":"Şablondaki ürünler şu an mevcut değil");if(n)go("cart")}
/* yorumlar */
function rvMode(p){const s=S();if(s.rvOn===false)return s.rvMode==="ro"?"ro":"off";return p.rm==="off"?"off":p.rm==="ro"?"ro":"on"}
const prv=p=>D.revs.filter(r=>r.pid===p.id);
function rvBadge(p){if(rvMode(p)==="off")return"";const a=prv(p);return a.length?`<span class="mu">★ ${(a.reduce((x,r)=>x+r.stars,0)/a.length).toFixed(1)} (${a.length})</span>`:""}
function rvH(p){const m=rvMode(p);if(m==="off")return"";const a=prv(p).sort((x,y)=>y.ts-x.ts),u=me();
 return `<h3 style="margin-top:14px">Yorumlar${a.length?" ("+a.length+")":""}</h3>`+(a.length?a.slice(0,20).map(r=>`<div style="margin:8px 0"><span class="stars" aria-label="${r.stars} yıldız">${"★".repeat(r.stars)}${"☆".repeat(5-r.stars)}</span> <b>${esc(r.name)}</b> <span class="mu">${esc(r.at)}</span><div>${esc(r.text)}</div></div>`).join(""):'<p class="mu">Henüz yorum yok.</p>')+(m==="ro"?'<p class="mu">Bu ürün için yeni yorum kapalıdır.</p>':u?`<label>Puanınız</label><select id="rs">${[5,4,3,2,1].map(n=>`<option>${n}</option>`).join("")}</select><label>Yorumunuz</label><textarea id="rt" rows="2"></textarea><p><button class="p" onclick="rsend(${p.id})">Yorumu gönder</button></p>`:`<p class="mu">Yorum yazmak için <a href="/hesabim" onclick="modal();return lk('acc')">giriş yapın</a>.</p>`)}
function rsend(pid){const u=me(),p=D.products.find(x=>x.id===pid);if(!u||!p||rvMode(p)!=="on")return;clr();const t=v("rt");if(t.length<3)return fe("rt","Yorumunuz en az 3 karakter olmalı.");
 D.revs=D.revs.filter(r=>!(r.pid===pid&&r.uid===u.id));D.revs.push({id:D.seq++,pid,uid:u.id,name:u.name,stars:+$("#rs").value,text:t,at:new Date().toLocaleDateString("tr-TR"),ts:Date.now()});save();toast("Yorumunuz yayınlandı");detail(pid);if(ui.v==="shop")grid()}
/* yönetim: duyuru + bildirim */
function aAnn(){return `<div class="two"><div class="card"><h3>Yeni duyuru</h3><p class="mu">Yayındaki duyurular sitenin sayfalarının üstünde herkese görünür.</p><label>Başlık</label><input id="an1"><label>Metin (isteğe bağlı)</label><textarea id="an2" rows="3"></textarea><p><button class="p" onclick="annAdd()">Yayınla</button></p></div>
 <div class="card"><h3>Müşteriye bildirim gönder</h3><p class="mu">Müşterinin “Bildirimler” sayfasında görünür.</p><label>Kime</label><select id="nn0"><option value="">Tüm kayıtlı müşteriler</option>${D.users.map(u=>`<option value="${u.id}">${esc(u.name)}</option>`).join("")}</select><label>Başlık</label><input id="nn1"><label>Mesaj</label><textarea id="nn2" rows="3"></textarea><p><button class="p" onclick="noteSend()">Gönder</button></p></div></div>
 <h3 style="margin-top:16px">Duyurular</h3>${D.ann.length?D.ann.map(a=>`<div class="card" style="margin-bottom:8px"><div class="row"><b>${esc(a.t)}</b><span class="badge ${a.on?"":"out"}">${a.on?"Yayında":"Kapalı"}</span><span class="sp"></span><button onclick="annTg(${a.id})">${a.on?"Yayından kaldır":"Yayınla"}</button><button class="d" onclick="annDel(${a.id})">Sil</button></div><div class="mu">${esc(a.m)}</div></div>`).join(""):'<p class="mu">Duyuru yok.</p>'}
 <h3 style="margin-top:16px">Gönderilen bildirimler</h3>${D.notes.length?D.notes.slice(0,40).map(n=>{const u=D.users.find(x=>x.id===n.uid);return `<div class="card" style="margin-bottom:8px"><div class="row"><b>${esc(n.t)}</b><span class="badge">${n.uid==null?"Tüm müşteriler":esc(u?u.name:"—")}</span><span class="sp"></span><span class="mu">${esc(n.at)}</span><button class="d" onclick="noteDel(${n.id})">Sil</button></div><div class="mu">${esc(n.m)}</div></div>`}).join(""):'<p class="mu">Bildirim yok.</p>'}`}
function annAdd(){clr();const t=v("an1");if(!t)return fe("an1","Başlık yazın.");D.ann.unshift({id:D.seq++,t,m:v("an2"),on:true,at:new Date().toLocaleString("tr-TR")});save();render();toast("Duyuru yayınlandı")}
function annTg(id){const a=D.ann.find(x=>x.id===id);a.on=!a.on;save();render()}
function annDel(id){if(confirm("Duyuru silinsin mi?")){D.ann=D.ann.filter(a=>a.id!==id);save();render()}}
function noteSend(){clr();const t=v("nn1"),m=v("nn2");if(!t)return fe("nn1","Başlık yazın.");if(!m)return fe("nn2","Mesaj yazın.");const w=$("#nn0").value;D.notes.unshift({id:D.seq++,uid:w?+w:null,t,m,kind:"admin",ts:Date.now(),at:new Date().toLocaleString("tr-TR")});save();render();toast("Bildirim gönderildi")}
function noteDel(id){D.notes=D.notes.filter(n=>n.id!==id);save();render()}
/* yönetim: yorumlar */
function aRevs(){const s=S();return `<div class="card" style="margin-bottom:12px"><label style="display:flex;gap:8px;align-items:center;color:var(--tx)"><input type="checkbox" style="width:auto" ${s.rvOn!==false?"checked":""} onchange="S().rvOn=this.checked;save();render()"> Müşteri yorumları genel olarak açık</label><label>Genel olarak kapalıyken</label><select style="max-width:420px" onchange="S().rvMode=this.value;save();toast('Kaydedildi')"><option value="off" ${s.rvMode!=="ro"?"selected":""}>Yorumları hiç gösterme</option><option value="ro" ${s.rvMode==="ro"?"selected":""}>Mevcut yorumlar görünsün, yeni yorum yapılamasın</option></select><p class="mu">Tek bir ürün için ayar: Ürünler sekmesi → “Yorum” sütunu.</p></div>`+(D.revs.length?[...D.revs].sort((a,b)=>b.ts-a.ts).map(r=>{const p=D.products.find(x=>x.id===r.pid);return `<div class="card" style="margin-bottom:8px"><div class="row"><b>${esc(p?p.name:"(silinmiş ürün)")}</b><span class="stars">${"★".repeat(r.stars)}</span><span class="mu">${esc(r.name)} · ${esc(r.at)}</span><span class="sp"></span><button class="d" onclick="revDel(${r.id})">Sil</button></div><div>${esc(r.text)}</div></div>`}).join(""):'<p class="mu">Henüz ürün yorumu yok.</p>')}
function revDel(id){if(confirm("Yorum silinsin mi?")){D.revs=D.revs.filter(r=>r.id!==id);save();render()}}
/* yönetim: şablonlar */
function aTpls(){return `<p class="mu">İşletme türüne göre hazır sipariş şablonları. Müşteri tek tıkla şablondaki ürünleri sepetine ekler; kayıt sırasında seçtiği işletme türüyle aynı adlı şablon öne çıkar.</p><p><button class="p" onclick="tNew()">+ Yeni şablon</button></p>`+D.tpls.map(t=>`<div class="card" style="margin-bottom:10px"><div class="row"><b>${esc(t.name)}</b><span class="mu">${t.items.length} ürün</span><span class="sp"></span><button onclick="tEdit(${t.id})">Düzenle</button><button class="d" onclick="tDel(${t.id})">Sil</button></div><div class="mu">${t.items.map(i=>{const p=D.products.find(x=>x.id===i.pid);return p?esc(p.name)+" ×"+i.q:""}).filter(Boolean).join(", ")||"Boş şablon"}</div></div>`).join("")}
function tNew(){const n=prompt("Şablon adı (ör. Kebap, Hotel, Pastane)");if(!n||!n.trim())return;const t={id:D.seq++,name:n.trim(),items:[]};D.tpls.push(t);save();render();tEdit(t.id)}
function tDel(id){if(confirm("Şablon silinsin mi?")){D.tpls=D.tpls.filter(t=>t.id!==id);save();render()}}
function tEdit(id){const t=D.tpls.find(x=>x.id===id);ui.te={id,name:t.name,items:t.items.map(i=>({n:(D.products.find(p=>p.id===i.pid)||{}).name||"",q:i.q}))};tModal()}
function tModal(){const e=ui.te;modal(`<h2>Şablonu düzenle</h2><label>Şablon adı</label><input id="tn" value="${esc(e.name)}" oninput="ui.te.name=this.value"><datalist id="pl">${D.products.map(p=>`<option value="${esc(p.name)}">`).join("")}</datalist><h3 style="margin-top:12px">Ürünler</h3>${e.items.map((x,i)=>`<div class="row" style="margin-bottom:6px"><input list="pl" style="flex:1;min-width:160px" value="${esc(x.n)}" placeholder="Ürün adı yazın…" aria-label="Ürün" onchange="ui.te.items[${i}].n=this.value"><input type="number" step="any" min="0" style="width:90px" value="${x.q}" aria-label="Miktar" onchange="ui.te.items[${i}].q=parseFloat(this.value)||1"><button class="d" onclick="ui.te.items.splice(${i},1);tModal()">Sil</button></div>`).join("")}<p><button onclick="ui.te.items.push({n:'',q:1});tModal()">+ Ürün ekle</button></p><p class="row"><button class="p" onclick="tSave()">Kaydet</button><button onclick="modal()">İptal</button></p>`)}
function tSave(){const e=ui.te;if(!e.name.trim())return toast("Şablon adı gerekli");const items=[],bad=[];e.items.forEach(x=>{if(!x.n.trim())return;const p=D.products.find(p=>p.name===x.n.trim());if(p)items.push({pid:p.id,q:x.q||1});else bad.push(x.n)});if(bad.length)return toast("Listede olmayan ürün: "+bad[0]);const t=D.tpls.find(x=>x.id===e.id);t.name=e.name.trim();t.items=items;save();modal();render();toast("Şablon kaydedildi")}

if(CC==="1")loadGA();trackInit();render();
</script></body></html>
